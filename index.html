<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Java-IDE · GSG Osnabrück</title>
    <link rel="icon" type="image/png" href="assets/graphics/gsg/favicon-64.png">
    <link rel="apple-touch-icon" href="assets/graphics/gsg/apple-touch-icon.png">
    <meta name="theme-color" content="#00376D">
    <!-- Name der Schule, Impressum und Datenschutz aus der Verwaltung (Aussehen) -->
    <script src="/branding/schule.js"></script>
    <!-- Schulfarben aus der Verwaltung (Aussehen); fehlt das Backend, gelten die Farben aus gsg-branding.css -->
    <link rel="stylesheet" href="/branding/farben.css">
    <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1.0, minimal-ui'>


    <script type="module" src="/src/client/main/IDEStarter.ts"></script>
</head>

<body class="joeCssFence">
    <!-- Helper-Box mit Erklärungen -->
    <div style="display: none;" class="jo_helperBox jo_arrow_box jo_arrow_box_right">
        <div class="img_info-sign" style="width: 64px; height: 64px; float: left; margin-right: 15px"></div>
        <span></span>
        <div id="arrowBoxButtonOuter">
            <div class="jo_button jo_active">OK</div>
        </div>
    </div>

    <!-- Bitte-Warten-Text nach dem Logout (bis die Einstellungen gespeichert sind)-->
    <div id="bitteWarten">
        <div class="jo_login_div">
            <div id="bitteWartenText">Please wait/bitte warten...</div>
        </div>
        <div id="login-spinner1" class="jo_login_div">
            <img src="assets/graphics/ball-triangle.svg">
        </div>
    </div>

    <!-- Login-Seite: angepasst für das Graf-Stauffenberg-Gymnasium Osnabrück (Texte/Links: SchoolBranding.ts, Stil: gsg-branding.css) -->
    <div id="login" class="gsg-login">
        <main class="gsg-login-main">
            <div class="gsg-login-card">
                <img class="gsg-login-logo" src="/branding/logo" onerror="this.onerror=null; this.src='assets/graphics/gsg/logo-256.png'"
                    alt="Logo der Schule" width="112" height="112">
                <h1 class="gsg-login-title">Java-IDE</h1>
                <p class="gsg-login-school" data-schule="name">Graf-Stauffenberg-Gymnasium Osnabrück</p>
                <a class="gsg-iserv-button gsg-iserv-only" href="/auth/iserv/login?app=java" hidden>Mit IServ anmelden</a>
                <div class="gsg-login-divider gsg-iserv-only" hidden><span>oder mit lokalem Konto</span></div>
                <div id="login-center">
                    <label class="gsg-sr-only" for="login-username">Benutzername</label>
                    <input id="login-username" type="text" placeholder="Benutzername" spellcheck="false"
                        autocomplete="username" autocapitalize="none" tabindex="1">
                    <label class="gsg-sr-only" for="login-password">Passwort</label>
                    <input id="login-password" type="password" placeholder="Passwort" spellcheck="false"
                        autocomplete="current-password" tabindex="2">
                    <div id="login-message" role="alert"></div>
                    <div id="login-button" role="button" tabindex="3">Anmelden</div>
                </div>
                <div id="login-spinner" class="jo_login_div">
                    <img src="assets/graphics/ball-triangle.svg" alt="">
                </div>
            </div>
            <div id="versionDiv" class="versionDiv"></div>
        </main>
        <footer id="login-footer">
            <div class="gsg-footer-school" data-schule="name">Graf-Stauffenberg-Gymnasium Osnabrück</div>
            <div id="login-datenschutz">
                <a data-schule-link="impressum" href="https://gsg-os.de/impressum/" target="_blank" rel="noopener">Impressum</a>
                <a data-schule-link="datenschutz" href="https://gsg-os.de/datenschutzerklaerung/" target="_blank" rel="noopener">Datenschutz</a>
                <a href="https://github.com/EduTempel/Online-IDE-new-compiler" target="_blank" rel="noopener">Quellcode</a>
            </div>
            <div class="gsg-credits">
                Basiert auf der <a href="https://github.com/martin-pabst/Online-IDE-new-compiler" target="_blank"
                    rel="noopener">Online-IDE</a> von Martin Pabst (GNU GPL v3) ·
                <a href="/mitwirkende/" target="_blank" rel="noopener">Mitwirkende und Lizenzen</a>
            </div>
        </footer>
    </div>

    <!-- Hauptseite -->

    <div id="main">
        <div id="code">
            <div id="mainmenu">
            </div>
            <div id="belowmainmenu">
                <div id="leftpanel">
                    <!-- <div id="slider1" class="slider" draggable="false"></div> -->
                    <div class="jo_projectexplorer">

                        <!-- Explorer and tabs are program generated by class Accordion -->

                    </div>
                    <div class="jo_editorFontSize jo_debugger">

                        <!-- Explorer and tabs are program generated by class Accordion -->

                    </div>
                </div>
                <div id="editoranderrors">
                    <div id="debugpanel">
                        <div id="view-mode">

                        </div>
                        <div id="controls">
                        </div>
                        <div class="languageElement jo_button jo_active" title ="Auswahl der Sprache" style="margin-left: 10px"></div>
                        <div id="buttonUserSettings" title="Benutzereinstellungen" 
                            class="img_user jo_button jo_active"></div>
                        <span id="menupanel-username" style="user-select: none"></span>
                        <div id="buttonLogout" title="Logout" style="margin-left: 8px"
                            class="img_disconnect-dark jo_button jo_active"></div>
                    </div>
                    <div id="diffEditor"></div>
                    <div id="editor">
                        <!-- <div class="editButton" title="Programm anhalten damit der Programmtext bearbeitbar wird"></div> -->
                    </div>
                    <div id="bottomdiv-outer">
                        <!-- <div id="slider2" class="jo_slider" draggable="false"></div> -->
                        <div class="jo_bottomdiv-inner">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div id="rightdiv" class="jo_editorFontSize" draggable="false">
            <!-- <div id="slider3" class="jo_slider" draggable="false"></div> -->

            <div id="rightdiv-inner">


            </div>



        </div>
    </div>

    <div id="synchronize-div" style="display: none;"></div>
    <div id="createRepo-div"></div>
    <div id="updateRepo-div"></div>
    <div id="checkoutRepo-div"></div>
    <div id="spritemanager-div"></div>

    <div id="dialog">
    </div>

</body>

</html>
